version: 2.1

# Pipeline-level parameters
parameters:
  terraform-organization:
    type: string
    default: "my-org"
  terraform-workspace:
    type: string
    default: "my-workspace"

# Official Terraform orb
orbs:
  terraform: circleci/terraform@3.1.0

# Docker executor with a pinned Terraform CLI image
executors:
  tf-executor:
    docker:
      - image: hashicorp/terraform:1.5.3

# Reusable login command to Terraform Cloud
commands:
  tf-login:
    description: Authenticate to Terraform Cloud
    steps:
      - run:
          name: Terraform Cloud Login
          command: echo $TFC_TOKEN | terraform login --token

jobs:
  plan:
    executor: tf-executor
    steps:
      - checkout

      - tf-login

      - terraform/init:
          backend_config: |
            hostname=app.terraform.io
            organization=<< pipeline.parameters.terraform-organization >>
            workspaces[name]=<< pipeline.parameters.terraform-workspace >>

      - run:
          name: Terraform Plan
          command: terraform plan -out=tfplan -input=false

      - store_artifacts:
          path: tfplan
          destination: terraform-plan-output

      - persist_to_workspace:
          root: .
          paths:
            - tfplan

  apply:
    executor: tf-executor
    steps:
      - attach_workspace:
          at: .

      - tf-login

      - terraform/init:
          backend_config: |
            hostname=app.terraform.io
            organization=<< pipeline.parameters.terraform-organization >>
            workspaces[name]=<< pipeline.parameters.terraform-workspace >>

      - terraform/apply:
          plan: tfplan
          extra_args: "-input=false -auto-approve"

  hold:
    type: approval
    description: Manual approval before applying Terraform changes

workflows:
  version
